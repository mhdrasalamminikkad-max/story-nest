name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync to Android
      run: npx cap sync android

    - name: Create Debug Keystore
      run: |
        mkdir -p android/app
        keytool -genkeypair -v -keystore android/app/keystore.jks -alias android -storetype PKCS12 \
        -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
        -dname "CN=Android Developer, OU=Android, O=Company, L=City, S=State, C=US"

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
        KEYSTORE_PASSWORD: android
        KEY_ALIAS: android
        KEY_PASSWORD: android

    - name: Build Android APK (Release)
      run: |
        cd android
        ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
        KEYSTORE_PASSWORD: android
        KEY_ALIAS: android
        KEY_PASSWORD: android

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
